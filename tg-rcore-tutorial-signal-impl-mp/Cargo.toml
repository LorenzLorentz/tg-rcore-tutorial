[package]
name = "tg-rcore-tutorial-signal-impl-mp"
description = "MP-ready signal implementation for rCore tutorial OS."
version = "0.4.8"
edition = "2024"
authors = ["scPointer <jax01@foxmail.com>"]
repository = "https://github.com/rcore-os/tg-rcore-tutorial-signal-impl"
homepage = "https://github.com/rcore-os/tg-rcore-tutorial-signal-impl/tree/test"
documentation = "https://docs.rs/tg-rcore-tutorial-signal-impl-mp"
license = "GPL-3.0"
readme = "README.md"
keywords = ["rcore", "signal", "no-std", "riscv"]
categories = ["no-std", "embedded"]

[dependencies]
tg-kernel-context = { package = "tg-rcore-tutorial-kernel-context-mp", path = "../tg-rcore-tutorial-kernel-context-mp", version = "0.4.8" }
tg-signal = { package = "tg-rcore-tutorial-signal-mp", path = "../tg-rcore-tutorial-signal-mp", version = "0.4.8" }
