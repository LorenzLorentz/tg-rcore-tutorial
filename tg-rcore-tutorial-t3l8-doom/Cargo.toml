[package]
name = "wpj-tg-rcore-tutorial-t3l8-doom"
description = "Task3 Lab8 Doom scaffold based on tg-rcore-tutorial ch8."
version = "0.0.0"
edition = "2024"
authors = ["OpenAI Codex"]
license = "GPL-3.0"
readme = "README.md"
keywords = ["rcore", "tutorial", "no-std", "riscv", "doom"]
categories = ["no-std", "embedded"]
exclude = [
    "tg-user/**",
#    ".cargo/config.toml",
]

[features]
exercise = []

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[dependencies]
virtio-drivers = { path = "../vendor/virtio-drivers" }
xmas-elf = "0.8.0"
riscv = "0.10.1"
spin = "0.9"
tg-gfx = { package = "wpj-tg-rcore-tutorial-gfx", path = "../tg-rcore-tutorial-gfx" }

tg-sbi = { package = "tg-rcore-tutorial-sbi", version = "0.4.8", features = ["nobios"] }
tg-linker = { package = "tg-rcore-tutorial-linker", version = "0.4.8" }
tg-console = { package = "tg-rcore-tutorial-console", version = "0.4.8" }
tg-kernel-context = { package = "tg-rcore-tutorial-kernel-context", version = "0.4.8", features = ["foreign"] }
tg-kernel-alloc = { package = "tg-rcore-tutorial-kernel-alloc", version = "0.4.8" }
tg-kernel-vm = { package = "tg-rcore-tutorial-kernel-vm", version = "0.4.8" }
tg-syscall = { package = "tg-rcore-tutorial-syscall", path = "../tg-rcore-tutorial-syscall", version = "0.4.8", features = ["kernel"] }
tg-task-manage = { package = "tg-rcore-tutorial-task-manage", version = "0.4.8", features = ["thread"] }
tg-easy-fs = { package = "tg-rcore-tutorial-easy-fs", version = "0.4.8" }
tg-signal = { package = "tg-rcore-tutorial-signal", version = "0.4.8" }
tg-signal-impl = { package = "tg-rcore-tutorial-signal-impl", version = "0.4.8" }
tg-sync = { package = "tg-rcore-tutorial-sync", version = "0.4.8" }

[build-dependencies]
tg-linker = { package = "tg-rcore-tutorial-linker", version = "0.4.8" }
tg-easy-fs = { package = "tg-rcore-tutorial-easy-fs", version = "0.4.8" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
