[package]
name = "wpj-tg-rcore-tutorial-t4l45"
description = "Merged baseline of scheduler and synchronization labs for interrupt-ready and multicore-ready follow-up experiments."
version = "0.0.0"
edition = "2024"
authors = ["YdrMaster <ydrml@hotmail.com>", "Yifan Wang <w-yf22@mails.tsinghua.edu.cn>", "Yu Chen <yuchen@tsinghua.edu.cn>"]
license = "GPL-3.0"
readme = "README.md"
keywords = ["rcore", "tutorial", "no-std", "riscv", "scheduler", "synchronization"]
categories = ["no-std", "embedded"]
exclude = [
    "tg-rcore-tutorial-user/**",
#    ".cargo/config.toml",
]

[features]
exercise = []

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[dependencies]
virtio-drivers = "0.1.0"
xmas-elf = "0.8.0"
riscv = "0.10.1"
spin = "0.9"

tg-sbi = { package = "tg-rcore-tutorial-sbi-mp", path = "../tg-rcore-tutorial-sbi-mp", version = "0.4.8", features = ["nobios"] }
tg-linker = { package = "tg-rcore-tutorial-linker", version = "0.4.8" }
tg-console = { package = "tg-rcore-tutorial-console", version = "0.4.8" }
tg-kernel-context = { package = "tg-rcore-tutorial-kernel-context-mp", path = "../tg-rcore-tutorial-kernel-context-mp", version = "0.4.8", features = ["foreign"] }
tg-kernel-alloc = { package = "tg-rcore-tutorial-kernel-alloc-mp", path = "../tg-rcore-tutorial-kernel-alloc-mp", version = "0.4.8" }
tg-kernel-vm = { package = "tg-rcore-tutorial-kernel-vm", version = "0.4.8" }
tg-syscall = { package = "tg-rcore-tutorial-syscall", version = "0.4.8", features = ["kernel"] }
tg-task-manage = { package = "tg-rcore-tutorial-task-manage", version = "0.4.8", features = ["thread"] }
tg-easy-fs = { package = "tg-rcore-tutorial-easy-fs", version = "0.4.8" }
tg-signal = { package = "tg-rcore-tutorial-signal-mp", path = "../tg-rcore-tutorial-signal-mp", version = "0.4.8" }
tg-signal-impl = { package = "tg-rcore-tutorial-signal-impl-mp", path = "../tg-rcore-tutorial-signal-impl-mp", version = "0.4.8" }
tg-sync = { package = "wpj-tg-rcore-tutorial-sync-mp", path = "../tg-rcore-tutorial-sync-mp", version = "0.0.0" }

[build-dependencies]
tg-linker = { package = "tg-rcore-tutorial-linker", version = "0.4.8" }
tg-easy-fs = { package = "tg-rcore-tutorial-easy-fs", version = "0.4.8" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
